# Terminal start directory
directory ~/Desktop

# Valorant palette (fixed, so it does not drift with the wallpaper): charcoal, cream, red. No blue or teal.
foreground              #ece8e1
background              #0b0f14
selection_foreground    #0b0f14
selection_background    #ff4655
cursor                  #ff4655
cursor_text_color       #0b0f14
url_color               #ff4655
active_border_color     #ff4655
inactive_border_color   #2a2c2e
active_tab_foreground   #ece8e1
active_tab_background   #ff4655
inactive_tab_foreground #8a8f8c
inactive_tab_background #141a21
color0  #1f2326
color8  #4f5458
color1  #ff4655
color9  #ff7380
color2  #7bd88f
color10 #a4e8b2
color3  #e8c46a
color11 #f3d98f
# ANSI "blue" slot remapped to a dusty rose, so ls/git output never turns blue
color4  #d9a0a8
color12 #ebbfc5
# ANSI "magenta" slot pulled to a raspberry red, so nothing reads as violet
color5  #d8577e
color13 #e98aa6
# ANSI "cyan" slot remapped to sand
color6  #c9b8a6
color14 #ddd0c2
color7  #ece8e1
color15 #ffffff

# Omen, very faint on the right; the left stays flat charcoal so text is readable.
# A heavier tint (0.7) keeps the art's blue light from showing. Delete these three lines for a plain background.
background_image        ~/Pictures/Wallpapers/valorant-terminal-subtle.png
background_image_layout cscaled
background_tint         0.7
window_padding_width    14
tab_bar_style           slant
