# Terminal start directory
directory ~/Desktop

# Valorant palette (fixed, so it does not drift with the wallpaper): navy, cream, red, teal.
foreground              #ece8e1
background              #0f1923
selection_foreground    #0f1923
selection_background    #ff4655
cursor                  #ff4655
cursor_text_color       #0f1923
url_color               #3dd6c6
active_border_color     #ff4655
inactive_border_color   #1f2a36
active_tab_foreground   #ece8e1
active_tab_background   #ff4655
inactive_tab_foreground #768079
inactive_tab_background #17222e
color0  #1f2326
color8  #4a5560
color1  #ff4655
color9  #ff7380
color2  #3dd6c6
color10 #7aeadc
color3  #e8c46a
color11 #f3d98f
color4  #5e7de0
color12 #8aa2f0
color5  #b04fd0
color13 #c97ee6
color6  #3dd6c6
color14 #7aeadc
color7  #ece8e1
color15 #ffffff

# Omen, very faint on the right; the left stays flat navy so text is readable.
# Delete these three lines for a plain background.
background_image        ~/Pictures/Wallpapers/valorant-terminal-subtle.png
background_image_layout cscaled
background_tint         0.55
window_padding_width    14
tab_bar_style           slant
